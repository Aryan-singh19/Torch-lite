name: CI & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript type-check
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Check bundle output exists
        run: |
          test -d dist
          test -f dist/index.html
          echo "Production build successfully verified."
